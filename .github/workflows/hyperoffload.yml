name: HyperOffload

on:
  pull_request:
    branches: [hyperoffload]
  push:
    branches: [hyperoffload, codex/hyperoffload-eager-port]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test planners, dispatch, buffers and opt-in integration
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests_extend/unit_tests/mindspeed/core/memory/hyper_offload -q
